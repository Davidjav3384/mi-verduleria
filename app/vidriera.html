<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verduleria Don David - Vidriera Digital</title>

    <!-- IMPORTACIÓN OFICIAL DE TAILWIND v4: Activa el compilador interactivo en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- CUERPO PRINCIPAL: Configura Flexbox vertical, fondo gris, márgenes de resguardo y altura mínima de pantalla -->
<body class="bg-gray-100 p-6 max-w-5xl mx-auto font-sans text-gray-800 flex flex-col min-h-screen">

    <!-- ENCABEZADO: Bloque superior verde con sombra, bordes suavizados y texto blanco -->
    <header class="bg-green-700 p-6 text-white rounded-xl mb-6 text-center shadow-md">
        <h1 class="text-2xl font-bold">Verduleria "Don David"</h1>
        <p class="text-sm text-green-100 mt-1">La Verduleria de los Precios Frescos</p>
    </header>

    <!-- BUSCADOR: Barra de texto blanca que ocupa el 100% de ancho con bordes redondeados -->
    <input 
       type="text" 
       id="busqueda" 
       placeholder="¿Qué estás buscando?"
       class="w-full p-3 border border-gray-300 rounded-xl mb-6 outline-none focus:border-green-600 bg-white shadow-sm transition-all" 
    />
    
    <!-- BARRA DE ORDEN / ESTADO: Panel para procesar la compra e interactuar con el botón -->
    <div class="bg-white p-6 rounded-xl border mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
        <div>
            <h3 class="font-bold text-lg">¿Terminaste de revisar los precios?</h3>
            <p id="mensaje-estado" class="text-gray-500 text-sm mt-1">Tu orden está lista para ser procesada.</p>
        </div>
        <!-- Botón de Encargar con transiciones de color al pasar el cursor (hover) -->
        <button id="btn-encargar" class="bg-orange-600 text-white hover:bg-orange-500 font-bold py-3 px-8 rounded-xl transition-colors duration-200 ease-in-out shadow-md hover:shadow-lg w-full sm:w-auto text-center cursor-pointer">
            Encargar
        </button>
    </div> 
    
    <!-- SECCIÓN DE TARJETAS: Elemento contenedor con grilla de 1 columna en móvil y 3 en escritorio -->
    <main id="lista-productos" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <!-- Las tarjetas dinámicas de verduras se inyectarán solas aquí mediante JavaScript -->
    </main>

    <!-- SECCIÓN DE STOCK: Contenedor inferior asignado para mostrar la tabla de inventario general -->
    <section class="mb-8">
        <h2 class="text-xl font-bold mb-4 text-gray-700">Listado General de Stock</h2>
        <div id="contenedor-tabla">
            <!-- El componente tabla de stock se inyectará solo aquí mediante JavaScript -->
        </div>
    </section>

    <!-- PIE DE PÁGINA: Texto centrado de color gris que se empuja al fondo gracias al margen automático (mt-auto) -->
    <footer class="bg-black p-4 text-white rounded-xl text-center shadow-inner mt-auto">
        <p class="text-sm text-gray-400">Estamos en Av. 9 de julio 4885 de lunes a domingos de 8.00 hrs. a 20.00 hrs.</p>
    </footer>

    <!-- LÓGICA DE PROGRAMACIÓN (CÓDIGO JAVASCRIPT) -->
    <script>
        // =========================================================================
        // 1. FUENTE DE DATOS PRINCIPAL: Array centralizado con las propiedades de los productos
        // =========================================================================
        const productos = [
            { id: 1, nombre: "Papa", precio: 2000, stock: 30 },
            { id: 2, nombre: "Cebolla", precio: 2500, stock: 0 }, // Cebolla configurada en 0 para evaluar el "Sin stock"
            { id: 3, nombre: "Tomate", precio: 2500, stock: 20 },
            { id: 4, nombre: "Lechuga", precio: 3500, stock: 10 },
            { id: 4, nombre: "Palta", precio: 6500, stock: 10 },
            { id: 4, nombre: "Zapallo", precio: 1700, stock: 10 }
        ];

        // =========================================================================
        // 2. ACCESO AL DOM (HTML): Captura de las referencias únicas usando selectores por ID (#)
        // =========================================================================
        const botonEncargar = document.querySelector('#btn-encargar');
        const mensajeEstado = document.querySelector('#mensaje-estado');
        const listaProductos = document.querySelector('#lista-productos');
        const contenedorTabla = document.querySelector('#contenedor-tabla');

        // =========================================================================
        // 3. EVENTO INTERACTIVO: Captura el clic del usuario para cambiar el mensaje de la orden
        // =========================================================================
        botonEncargar.addEventListener('click', () => {
            mensajeEstado.textContent = "¡Pedido encargado con éxito! 🎉";
        });

        // =========================================================================
        // 4. COMPONENTE REUTILIZABLE 1: Función constructora de tarjetas para la vidriera
        // =========================================================================
        function tarjeta(p) {
            let componenteBoton = "";

            // Regla de negocio en base al stock: define si muestra el botón de compra o aviso en rojo
            if (p.stock === 0) {
                componenteBoton = `<span class="text-red-600 font-bold block text-center py-2 bg-red-50 rounded-lg border border-red-200">Sin stock</span>`;
            } else {
                componenteBoton = `
                    <button class="bg-green-700 text-white hover:bg-green-600 font-bold py-2 px-6 rounded-lg transition-colors duration-200 shadow-md flex justify-center w-full items-center cursor-pointer">
                        Comprar
                    </button>
                `;
            }

            // Retorna la cadena de texto con la estructura HTML inyectando dinámicamente los valores
            return `
                <div class="bg-white p-4 rounded-xl border flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex justify-between font-bold mb-4">
                        <span class="text-lg">${p.nombre}</span>
                        <span class="text-green-700">$${p.precio.toLocaleString('es-AR')}</span>
                    </div>
                    ${componenteBoton}
                </div>
            `;
        }

        // =========================================================================
        // 5. COMPONENTE REUTILIZABLE 2: Función modular encargada de fabricar la tabla de inventario
        // =========================================================================
        function tablaStock(listaProductos) {
            let filas = ""; // Variable acumuladora de filas de texto HTML
            
            // Ciclo iterador for...of: recorre el array recibido fila por fila
            for (const p of listaProductos) {
                // Lógica condicional interna para cambiar estilos y textos según disponibilidad en la tabla
                const claseStock = p.stock === 0 ? "text-red-600 font-bold" : "text-gray-600 font-medium";
                const textoStock = p.stock === 0 ? "Sin stock" : `${p.stock} kg`;

                // Suma progresiva de hilos de texto con las celdas alineadas horizontalmente
                filas += `
                    <tr class="border-b border-gray-100 last:border-none hover:bg-gray-50/50 transition-colors">
                        <td class="p-3 text-gray-400 font-medium">#${p.id}</td>
                        <td class="p-3 font-semibold text-gray-800">${p.nombre}</td>
                        <td class="p-3 font-medium text-gray-600">$${p.precio.toLocaleString('es-AR')}</td>
                        <td class="p-3 ${claseStock}">${textoStock}</td>
                    </tr>
                `;
            }

            // Retorna el cascarón de la estructura de la tabla inyectando las filas generadas por el ciclo
            return `
                <div class="w-full bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <table class="w-full border-collapse text-left text-sm">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 font-bold uppercase text-xs tracking-wider">
                                <th class="p-3 w-16">ID</th>
                                <th class="p-3">Producto</th>
                                <th class="p-3">Precio</th>
                                <th class="p-3">Stock Disponible</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filas}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // =========================================================================
        // 6. CONTROLADORES DE INYECCIÓN (CONEXIÓN AL DOM)
        // =========================================================================
        
        // Ejecuta el motor de renderizado de tarjetas en una sola línea de código
        for (const producto of productos) listaProductos.innerHTML += tarjeta(producto);

        // Invoca el componente de tabla de stock pasándole el array de productos y escribe el resultado
        contenedorTabla.innerHTML = tablaStock(productos);

    </script>
</body>
</html>
